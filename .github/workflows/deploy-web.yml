name: Deploy Web (Admin + JSON)

on:
  push:
    branches: [main]
    paths: ['admin/**', 'docs/**']
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync Supabase → eventos.json"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin dependencies
        working-directory: admin
        run: npm install

      - name: Build admin panel
        working-directory: admin
        run: npm run build

      - name: Copy eventos.json and images
        run: |
          mkdir -p admin/dist/docs
          cp docs/eventos.json admin/dist/docs/ 2>/dev/null || echo '{"categorias":[],"eventos":[]}' > admin/dist/docs/eventos.json
          cp -r docs/img admin/dist/docs/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
